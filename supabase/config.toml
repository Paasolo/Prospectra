# Prospectra Supabase local configuration (Phase 0 skeleton).
# Schema migrations begin in Phase 2.

project_id = "prospectra"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/reset-password",
  "http://127.0.0.1:5173/app",
  "http://localhost:5173",
  "http://localhost:5173/reset-password",
  "http://localhost:5173/app",
]
jwt_expiry = 3600
minimum_password_length = 12
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions]
verify_jwt = true
